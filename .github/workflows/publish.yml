# Publishes the live site. Every time something is merged into main,
# the site files are copied to the gh-pages branch, which GitHub Pages serves.
# Draft previews in gh-pages/pr-preview/ are left alone.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Its own queue, so a draft preview can never push a publish run out of
# line. Both push to gh-pages; the deploy step rebases and retries if they
# land at the same moment.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the WIP pages
        run: |
          pip install markdown
          python3 tools/build-wips.py
      - name: Gather the site files
        run: rsync -a --exclude .git --exclude .github --exclude tools --exclude _wips ./ _site/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
