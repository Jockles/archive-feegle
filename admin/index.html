<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The back-end for uploading works in progress. Not linked from anywhere
    on the site. Sign in with a GitHub access token (see README.md).
    The form itself is set up in config.yml next to this file.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Back-end | jockles.com</title>
  <!-- site meta -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0b5563">
  <!-- /site meta -->
  <script>
    // The back-end only works over HTTPS, so send http:// visits to https://.
    if (location.protocol === "http:" && location.hostname !== "localhost") {
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
    }
  </script>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms@0.246.1/dist/sveltia-cms.js"></script>
</body>
</html>
